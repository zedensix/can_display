name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # mise.toml pins OpenSCAD as a macOS .dmg, for the faceplate's renders:
  # not built here.
  MISE_DISABLE_TOOLS: http:openscad,java,android-sdk,gradle

jobs:
  checks:
    name: Hooks and host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: bun install --frozen-lockfile
      # Every prek hook (.pre-commit-config.yaml): clang-format, Biome, bun check,
      # and the host tests with ASan and UBSan, built by gcc here.
      - run: prek run --all-files

  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      # The pico-sdk clone (PICO_SDK_PATH in mise.toml), ~400MB with its
      # submodules.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pico-sdk
          key: pico-sdk-${{ hashFiles('mise.toml') }}
      - run: mise run firmware
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: bin/*.uf2
