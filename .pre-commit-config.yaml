# Code quality on every commit, run by prek (installed by `mise install`;
# `prek run --all-files` to check everything, as the CI does). Generated sources
# (fonts, logo) are left as generated.
exclude: ^pico/src/app/ui/(fonts|logo)\.c$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=512]

  # C: formatting only. The compiler is the linter (-Wall -Wextra
  # -Werror), the host tests run with ASan and UBSan.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 98ad4ddb9c057de2f5b9e93e44e6db959807d68c # frozen: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c]

  - repo: local
    hooks:
      # TypeScript, Svelte, CSS, JSON: lint and format (biome.json; its
      # Svelte support is the experimental full HTML one).
      - id: biome
        name: biome
        entry: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        types_or: [ts, javascript, svelte, css, json]
      # Types, with Bun's own checker (tsc's errors, on every core).
      # --no-script: a "check" script in package.json would run instead.
      - id: bun-check
        name: bun check
        entry: bun check --no-script
        language: system
        files: ^(web|tools|faceplate|pico/tools)/.*\.(ts|svelte)$|^tsconfig\.json$
        pass_filenames: false
      # The web page's log store and parser (bun test).
      - id: web-tests
        name: web tests
        entry: bun test web
        language: system
        files: ^web/
        pass_filenames: false
      - id: tests
        name: host tests
        entry: mise run test
        language: system
        files: ^pico/(src/app|test)/
        pass_filenames: false
