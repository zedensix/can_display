# Code quality on every commit, run by prek (`prek install` once per
# clone; `prek run --all-files` to check everything). Generated sources
# (fonts, logo) are left as generated.
exclude: ^src/app/(fonts|logo)\.c$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=512]

  # C: formatting only. The compiler is the linter (-Wall -Wextra
  # -Werror), the host tests run with ASan and UBSan.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 98ad4ddb9c057de2f5b9e93e44e6db959807d68c # frozen: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c]

  - repo: local
    hooks:
      # TypeScript, CSS, JSON: lint and format (biome.json).
      - id: biome
        name: biome
        entry: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        types_or: [ts, javascript, css, json]
      - id: tsc
        name: tsc
        entry: bunx tsc -p tsconfig.json
        language: system
        files: ^(web|tools)/.*\.ts$
        pass_filenames: false
      - id: tests
        name: host tests
        entry: mise run test
        language: system
        files: ^(src/app|test)/
        pass_filenames: false
