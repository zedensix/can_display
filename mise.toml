[tools]
cmake = "4.4.5"
ninja = "1.13.2"
"asdf:mise-plugins/mise-gcc-arm-none-eabi" = "14.3.Rel1"
python = "3.14.10"
# The web page (web/): its server, bundler and Tailwind build.
bun = "1.4.4"
# Git hooks (.pre-commit-config.yaml), set up by `mise install` (below).
prek = "0.5.9"
node = "latest"

# OpenSCAD, for the faceplate's PNG previews (`mise run faceplate`; its STL
# renders in-process with openscad-wasm). The last release (2021.01) is
# Intel-only, so this pins a nightly snapshot, native on Apple Silicon.
# Snapshots stay up about a year on files.openscad.org: bump the version
# when this one is gone. mise can't unpack a .dmg itself, hence the
# postinstall.
[tools.'http:openscad']
version = "2026.10.11"
url = "https://files.openscad.org/snapshots/OpenSCAD-{{ version }}.dmg"
bin_path = "OpenSCAD.app/Contents/MacOS"
postinstall = '''
set -e
dmg=$(find "$MISE_TOOL_INSTALL_PATH" -name '*.dmg' | head -1)
mnt=$(mktemp -d)
hdiutil attach -nobrowse -quiet -mountpoint "$mnt" "$dmg"
rm -rf "$MISE_TOOL_INSTALL_PATH/OpenSCAD.app"
cp -R "$mnt/OpenSCAD.app" "$MISE_TOOL_INSTALL_PATH/"
hdiutil detach -quiet "$mnt"
'''

# `mise install` sets up the git hooks: no clone forgets them.
[hooks]
postinstall = "prek install"

[env]
PICO_SDK_VERSION = "2.2.0"
PICO_SDK_PATH = "{{env.HOME}}/.cache/pico-sdk/2.2.0"
