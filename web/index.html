<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>GT86 Dash Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="../86.png">
</head>
<body class="min-h-dvh text-white antialiased">
  <div class="w-full px-4 pt-6 pb-10 sm:px-8">

    <header class="flex items-center gap-4">
      <img src="../86.png" alt="" class="size-16 shrink-0 rounded-full bg-white p-1 shadow-[0_0_30px_rgb(255_90_30/0.55)] ring-2 ring-accent">
      <div>
        <h1 class="font-display text-3xl font-bold tracking-widest text-accent">GT86 DASH</h1>
        <p class="text-sm text-dim">The data log, straight off the dash</p>
      </div>
    </header>

    <section class="mt-6 rounded-2xl border border-frame bg-panel/90 p-5 shadow-[0_0_40px_rgb(255_90_30/0.08)]">
      <ol class="grid gap-3 text-sm text-dim sm:grid-cols-3">
        <li class="flex gap-3"><span class="font-display text-xl font-bold text-accent">1</span>On the dash: Settings, Send log.</li>
        <li class="flex gap-3"><span class="font-display text-xl font-bold text-accent">2</span>Bluetooth on, then tap the button and pick GT86 DASH.</li>
        <li class="flex gap-3"><span class="font-display text-xl font-bold text-accent">3</span>Keep this page open until the download ends.</li>
      </ol>

      <button id="connect" class="mt-5 w-full rounded-xl bg-gradient-to-r from-accent to-hot py-4 font-display text-xl font-bold tracking-widest uppercase shadow-[0_0_30px_rgb(255_42_16/0.45)] transition active:scale-[0.98] disabled:opacity-40 disabled:shadow-none">
        Connect and download
      </button>

      <div id="transfer" class="mt-5 hidden">
        <div class="relative h-3 overflow-hidden rounded-full bg-frame">
          <div id="progress" class="sheen relative h-full w-0 overflow-hidden rounded-full bg-gradient-to-r from-accent to-hot transition-[width] duration-200"></div>
        </div>
        <div class="mt-2 flex justify-between font-display text-lg text-dim">
          <span id="received">0 KB</span>
          <span id="speed"></span>
        </div>
      </div>

      <p id="status" class="mt-3 min-h-6 text-sm text-dim"></p>
    </section>

    <section id="results" class="mt-6 hidden">
      <div class="grid grid-cols-2 gap-3 md:grid-cols-4">
        <div class="rounded-xl border border-frame bg-panel p-4">
          <div class="text-xs tracking-widest text-dim uppercase">Sessions</div>
          <div id="stat-sessions" class="font-display text-4xl font-bold">0</div>
        </div>
        <div class="rounded-xl border border-frame bg-panel p-4">
          <div class="text-xs tracking-widest text-dim uppercase">Engine running</div>
          <div id="stat-time" class="font-display text-4xl font-bold">0 min</div>
        </div>
        <div class="rounded-xl border border-frame bg-panel p-4">
          <div class="text-xs tracking-widest text-dim uppercase">Hottest oil</div>
          <div id="stat-oil" class="font-display text-4xl font-bold text-accent">--</div>
        </div>
        <div class="rounded-xl border border-frame bg-panel p-4">
          <div class="text-xs tracking-widest text-dim uppercase">Top RPM</div>
          <div id="stat-rpm" class="font-display text-4xl font-bold">--</div>
        </div>
      </div>

      <button id="csv" class="mt-4 w-full rounded-xl border border-accent bg-panel py-3 font-display text-lg font-semibold tracking-wider uppercase transition active:scale-[0.98] disabled:opacity-30">Save CSV</button>

      <div id="sessions" class="mt-6 grid gap-4 md:grid-cols-2 xl:grid-cols-3"></div>
    </section>

  </div>
  <script type="module" src="./app.ts"></script>
</body>
</html>
