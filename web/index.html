<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GT86 Dash Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="../86.png">
  <!-- The theme before the first paint: no flash of the wrong one (theme.ts keeps it after). -->
  <script>
    try {
      const mode = localStorage.getItem("theme");
      if (mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    } catch {}
  </script>
</head>
<body class="min-h-dvh antialiased">
  <div id="app"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
